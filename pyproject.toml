[project]
name = "jev-android-mcp"
version = "0.1.0"
description = "Accessibility-first Android emulator MCP with a Jev-style action loop"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx[http2]>=0.28,<1",
    "mcp[cli]>=2,<3",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
jev-android-mcp = "jev_android_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_android_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
